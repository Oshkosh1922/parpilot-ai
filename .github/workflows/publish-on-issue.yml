name: Publish verified ParPilot release
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  publish:
    if: github.event.issue.title == 'Publish verified ParPilot 0.4 release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish checksum-verified source
        run: bash .release/publish.sh
      - name: Close release trigger issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed'})
